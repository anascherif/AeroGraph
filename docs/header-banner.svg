<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-label="AeroGraph — spatial memory engine for visually impaired users">
  <title>AeroGraph</title>
  <desc>Spatial memory engine for visually impaired users. Built for the Assistive Innovation Challenge 2026.</desc>

  <defs>
    <!-- Background gradient: deep navy -> slightly lighter navy -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#1E3A5F"/>
    </linearGradient>

    <!-- Radar-sweep arc fade -->
    <radialGradient id="radar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#22D3EE" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft glow for the brand mark -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle grid pattern for the spatial-graph area -->
    <pattern id="grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#22D3EE" stroke-width="0.4" stroke-opacity="0.18"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" fill="url(#bg)"/>

  <!-- Faint grid overlay across the whole banner -->
  <rect width="1280" height="320" fill="url(#grid)"/>

  <!-- Left: radar-sweep + concentric rings (the "detect" in AeroGraph) -->
  <g transform="translate(120, 160)">
    <!-- Three concentric radar rings -->
    <circle r="110" fill="none" stroke="#22D3EE" stroke-opacity="0.18" stroke-width="1"/>
    <circle r="80"  fill="none" stroke="#22D3EE" stroke-opacity="0.28" stroke-width="1"/>
    <circle r="50"  fill="none" stroke="#22D3EE" stroke-opacity="0.45" stroke-width="1"/>
    <!-- Radar sweep glow -->
    <circle r="120" fill="url(#radar)"/>
    <!-- Crosshairs -->
    <line x1="-110" y1="0" x2="110" y2="0" stroke="#22D3EE" stroke-opacity="0.25" stroke-width="1"/>
    <line x1="0" y1="-110" x2="0" y2="110" stroke="#22D3EE" stroke-opacity="0.25" stroke-width="1"/>
    <!-- Pin marker (the user in their world) -->
    <g filter="url(#glow)">
      <path d="M0,-32 C-12,-32 -20,-22 -20,-10 C-20,4 0,22 0,22 C0,22 20,4 20,-10 C20,-22 12,-32 0,-32 Z"
            fill="#22D3EE" fill-opacity="0.85"/>
      <circle cx="0" cy="-12" r="6" fill="#0A1628"/>
      <circle cx="0" cy="-12" r="2.5" fill="#22D3EE"/>
    </g>
  </g>

  <!-- Center-left: brand wordmark + tagline stack -->
  <g transform="translate(290, 110)">
    <!-- Eyebrow tag -->
    <g>
      <rect x="0" y="-26" width="178" height="22" rx="11" fill="#22D3EE" fill-opacity="0.12"/>
      <text x="14" y="-10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="11" font-weight="600" fill="#22D3EE" letter-spacing="2">
        ASSISTIVE INNOVATION 2026
      </text>
    </g>

    <!-- Brand wordmark -->
    <text x="0" y="34" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
          font-size="64" font-weight="700" fill="#F1F5F9" letter-spacing="-1.5">
      AeroGraph
    </text>

    <!-- Tagline -->
    <text x="2" y="72" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
          font-size="20" font-weight="400" fill="#94A3B8">
      A spatial memory engine
    </text>
    <text x="2" y="98" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
          font-size="20" font-weight="400" fill="#F1F5F9">
      for visually impaired users.
    </text>

    <!-- Capability chips -->
    <g transform="translate(0, 130)">
      <g>
        <rect x="0" y="0" width="74" height="22" rx="11" fill="#22D3EE" fill-opacity="0.10"/>
        <text x="37" y="15" font-family="ui-monospace, SFMono-Regular, monospace"
              font-size="11" font-weight="600" fill="#22D3EE" text-anchor="middle">
          DETECT
        </text>
      </g>
      <g transform="translate(86, 0)">
        <rect x="0" y="0" width="76" height="22" rx="11" fill="#22D3EE" fill-opacity="0.10"/>
        <text x="38" y="15" font-family="ui-monospace, SFMono-Regular, monospace"
              font-size="11" font-weight="600" fill="#22D3EE" text-anchor="middle">
          REMEMBER
        </text>
      </g>
      <g transform="translate(174, 0)">
        <rect x="0" y="0" width="74" height="22" rx="11" fill="#22D3EE" fill-opacity="0.10"/>
        <text x="37" y="15" font-family="ui-monospace, SFMono-Regular, monospace"
              font-size="11" font-weight="600" fill="#22D3EE" text-anchor="middle">
          NAVIGATE
        </text>
      </g>
      <g transform="translate(260, 0)">
        <rect x="0" y="0" width="78" height="22" rx="11" fill="#F1F5F9" fill-opacity="0.06"/>
        <text x="39" y="15" font-family="ui-monospace, SFMono-Regular, monospace"
              font-size="11" font-weight="600" fill="#F1F5F9" text-anchor="middle">
          CALL FOR HELP
        </text>
      </g>
    </g>
  </g>

  <!-- Right: spatial-graph visualization (the "memory" in AeroGraph) -->
  <g transform="translate(960, 160)" stroke="#22D3EE" stroke-opacity="0.35" fill="none">
    <!-- Connection lines first so nodes overlay them -->
    <line x1="-20" y1="-60" x2="50" y2="-10" stroke-width="1"/>
    <line x1="-20" y1="-60" x2="-50" y2="40" stroke-width="1"/>
    <line x1="50" y1="-10" x2="80" y2="60" stroke-width="1"/>
    <line x1="50" y1="-10" x2="-10" y2="80" stroke-width="1"/>
    <line x1="-50" y1="40" x2="-10" y2="80" stroke-width="1"/>
    <line x1="-10" y1="80" x2="80" y2="60" stroke-width="1"/>
    <line x1="-20" y1="-60" x2="80" y2="60" stroke-width="1" stroke-opacity="0.18" stroke-dasharray="2,4"/>

    <!-- Nodes (objects the user has placed in their memory) -->
    <g fill="#0A1628" stroke="#22D3EE" stroke-width="1.5">
      <circle cx="-20" cy="-60" r="6"/>
      <circle cx="50"  cy="-10" r="7"/>
      <circle cx="-50" cy="40"  r="5"/>
      <circle cx="80"  cy="60"  r="6"/>
      <circle cx="-10" cy="80"  r="7"/>
    </g>
    <!-- Pulse on the central node -->
    <g filter="url(#glow)">
      <circle cx="50" cy="-10" r="9" fill="#22D3EE" fill-opacity="0.18"/>
    </g>
    <!-- Tiny object labels -->
    <g font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" fill="#94A3B8" stroke="none">
      <text x="-32" y="-72">door</text>
      <text x="62"  y="-18">desk</text>
      <text x="-62" y="32">chair</text>
      <text x="92"  y="74">box</text>
      <text x="-22" y="96">keys</text>
    </g>
  </g>

  <!-- Bottom-right: devpost tag -->
  <g transform="translate(1100, 290)" font-family="ui-monospace, SFMono-Regular, monospace"
     font-size="11" fill="#94A3B8" letter-spacing="1.5">
    <text>DEVPOST.COM · AUG 1 2026</text>
  </g>
</svg>
